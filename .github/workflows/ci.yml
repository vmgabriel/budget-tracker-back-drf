name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push makes an in-flight run for the same ref irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff, Black, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Hatch
        run: uv tool install hatch

      # `make lint` is the project's own gate; it fails on the first Ruff,
      # Black, or mypy finding, which is what CI should report.
      - name: Run make lint
        run: make lint

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Hatch
        run: uv tool install hatch

      - name: Create environment file
        # `make install` copies the template. The secrets below are throwaway
        # values that exist only for the lifetime of this job's containers.
        run: make install

      # `make test` is both layers: the database-free unit suite through Hatch
      # (which includes the architecture test that keeps the domain layer
      # framework-free), then the integration suite through the Compose `tester`
      # service, on the same image and PostgreSQL major version as production.
      - name: Run make test
        run: make test

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 db redis

      - name: Stop the services
        if: always()
        run: docker compose down -v

  production:
    name: Production gates (schema + deploy checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Hatch
        run: uv tool install hatch

      - name: Create environment file
        run: make install

      # A broken override file only fails at deploy time otherwise. This checks
      # that the production stack (no published database ports, resource
      # limits, named volumes) still resolves.
      - name: Validate the production stack configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Validate the development stack configuration
        run: docker compose config --quiet

      - name: Check the Gunicorn config parses
        run: python3 -m py_compile src/config/gunicorn.conf.py

      # The operations scripts must at least be executable and parse. A syntax
      # error in the backup or restore script is invisible until the day it is
      # needed, which is the worst possible day to find it.
      - name: Check the operations scripts parse
        run: |
          for script in scripts/backup_db.sh scripts/backup_loop.sh scripts/restore_db.sh; do
            test -x "${script}"
            bash -n "${script}"
          done

      # Guards the API contract: an unintended schema change (a renamed or newly
      # required field) shows up here instead of in a client.
      - name: Validate the OpenAPI schema
        run: make schema

      - name: Build the production image
        run: make prod-build

      # Production is opt-in through DJANGO_ENVIRONMENT=production, and the
      # startup guards reject the template's development values (a weak secret,
      # HTTP origins, insecure cookies) on purpose. The deploy check therefore
      # has to run against a production-shaped environment file, which is what
      # this step builds from the template.
      - name: Write a production-shaped environment file
        run: |
          grep -vE '^(DJANGO_SECRET_KEY|DJANGO_ALLOWED_HOSTS|DJANGO_CSRF_TRUSTED_ORIGINS|CORS_ALLOWED_ORIGINS|DJANGO_SECURE_SSL_REDIRECT|DJANGO_SESSION_COOKIE_SECURE|DJANGO_CSRF_COOKIE_SECURE|DJANGO_DEBUG|DJANGO_ENVIRONMENT)=' .env > .env.ci
          cat >> .env.ci <<'EOF'
          DJANGO_SECRET_KEY=ci-only-production-settings-key-not-used-for-any-real-deployment-000000
          DJANGO_ALLOWED_HOSTS=api.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS=https://api.example.com
          CORS_ALLOWED_ORIGINS=https://bff.example.com
          DJANGO_SECURE_SSL_REDIRECT=true
          DJANGO_SESSION_COOKIE_SECURE=true
          DJANGO_CSRF_COOKIE_SECURE=true
          EOF
          mv .env.ci .env

      # `make check-deploy` runs `manage.py check --deploy` against the real
      # production Compose stack, so it exercises the same settings module and
      # override file an operator would, rather than a hand-assembled env.
      - name: Run make check-deploy
        run: make check-deploy

      - name: Stop any containers the deploy check started
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v
